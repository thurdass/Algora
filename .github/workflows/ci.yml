name: Validate Algora
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
        if: runner.os == 'Linux'
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - run: npm run test:desktop
        if: runner.os == 'Windows'
      - run: npm run dist:linux
        if: runner.os == 'Linux'
      - run: npm run dist:win
        if: runner.os == 'Windows'
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
        env:
          ALGORA_EXECUTABLE: release/linux-unpacked/algora
      - run: npm run test:desktop
        if: runner.os == 'Windows'
        env:
          ALGORA_EXECUTABLE: release/win-unpacked/algora.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Algora-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
