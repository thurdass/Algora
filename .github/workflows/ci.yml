name: Validate Java desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        if: runner.os == 'Linux'
      - run: xvfb-run -a ./gradlew build --no-daemon
        if: runner.os == 'Linux'
      - run: .\gradlew.bat build --no-daemon
        if: runner.os == 'Windows'
      - name: Ensure WiX 3 for JDK 21 jpackage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$wixBin) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe" | Select-Object -First 1
          }
          $wixBin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: ./gradlew :desktop:jpackageInstaller --no-daemon
        if: runner.os == 'Linux'
      - run: .\gradlew.bat :desktop:jpackageInstaller --no-daemon
        if: runner.os == 'Windows'
      - run: xvfb-run -a ./gradlew :desktop:jpackageSmokeTest --no-daemon
        if: runner.os == 'Linux'
      - run: .\gradlew.bat :desktop:jpackageSmokeTest --no-daemon
        if: runner.os == 'Windows'
      - name: Verify Linux window and desktop launcher identity
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y x11-utils
          xvfb-run -a python3 desktop/packaging/tests/verify-linux-desktop.py
      - name: Install, launch and uninstall Windows package
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($installer in Get-ChildItem desktop/build/jpackage/installer/* | Where-Object Extension -in '.exe', '.msi') {
            powershell.exe -NoProfile -File ./desktop/packaging/tests/verify-windows-installer-ui.ps1 -InstallerPath $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Installer UI test failed: $($installer.Name)" }
            ./desktop/packaging/tests/verify-windows-installer.ps1 -InstallerPath $installer.FullName
          }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: Windows-installer-diagnostics
          path: desktop/build/reports/installer/
      - uses: actions/upload-artifact@v4
        with:
          name: Algora-Java21-${{ runner.os }}
          path: desktop/build/jpackage/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JUnit-reports-${{ runner.os }}
          path: '**/build/reports/tests/'
